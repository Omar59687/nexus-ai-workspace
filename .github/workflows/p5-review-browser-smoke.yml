name: Phase 5 isolated Chromium reviewer acceptance

on:
  push:
    branches:
      - feature/p5-review-evidence-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      PYTHONIOENCODING: utf-8
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded browser test dependencies
        run: |
          python -m pip install "pytest>=8,<9" "playwright>=1.55,<2" "uvicorn>=0.30,<1" "pypdf>=6,<8" "fastapi>=0.115,<1" "pydantic>=2,<3" "pandas>=2.2,<3" "openpyxl>=3.1,<4"
          python -m playwright install --with-deps chromium
      - name: Real Chromium UI-to-test-server acceptance
        run: |
          python -m pytest -v -ra tests/test_financial_review_browser.py
